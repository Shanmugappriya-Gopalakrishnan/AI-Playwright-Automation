name: Playwright Tests

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

  schedule:
    - cron: '0 9 * * 1-5'

  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run tests on
        required: false
        default: all
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit

jobs:
  setup:
    runs-on: ubuntu-latest

    outputs:
      browsers: ${{ steps.set-browsers.outputs.browsers }}

    steps:
      - id: set-browsers
        run: |
          INPUT="${{ github.event.inputs.browser }}"
          if [ "$INPUT" = "all" ] || [ -z "$INPUT" ]; then
            echo 'browsers=["chromium","firefox","webkit"]' >> $GITHUB_OUTPUT
          else
            echo "browsers=[\"$INPUT\"]" >> $GITHUB_OUTPUT
          fi

  test:
    needs: setup

    runs-on: ubuntu-latest

    timeout-minutes: 60

    strategy:
      fail-fast: false

      matrix:
        browser: ${{ fromJson(needs.setup.outputs.browsers) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
          BASE_URL: https://shanmugappriya-procap.github.io/haus-store/

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  report:
    runs-on: ubuntu-latest

    needs: test

    if: always()

    steps:
      - name: Summary
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "✅ All Playwright tests passed!"
          else
            echo "❌ Some Playwright tests failed."
            exit 1
          fi
